name: Publicar no GitHub Pages

# Só entra em vigor depois de habilitar o Pages em
# Settings > Pages > Source: GitHub Actions. Antes disso o job falha no passo
# de deploy, o que é esperado.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publica só o site. `docs/` fica de fora de propósito: contém o manual
      # de marca em PDF e as fotos originais em alta, que não devem ir para um
      # servidor público. `scripts/` também não é do site.
      - name: Montar o pacote
        run: |
          mkdir -p _site
          cp index.html 404.html robots.txt sitemap.xml _site/
          cp -r assets _site/
          echo "--- conteúdo publicado ---"
          find _site -type f | sort
          echo "--- tamanho ---"
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
